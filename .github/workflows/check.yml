name: ISOD Notifier

on:
  schedule:
    - cron: '*/5 * * * *'   # mỗi 5 phút (GitHub có thể trễ vài phút khi tải cao)
  workflow_dispatch:          # cho phép bấm chạy thủ công trên tab Actions

# Chặn 2 lần chạy chồng lên nhau nếu lần trước chưa xong
concurrency:
  group: isod-notifier
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run checker (one-shot)
        env:
          ISOD_USERNAME: ${{ secrets.ISOD_USERNAME }}
          ISOD_API_KEY: ${{ secrets.ISOD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: python main.py --once
